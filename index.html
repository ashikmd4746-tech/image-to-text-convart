<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://pl28365550.effectivegatecpm.com/5d/02/83/5d028399e5956539636792bed87f774f.js"></script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashik OCR Tool</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>

<style>
body{margin:0;font-family:monospace;background:#050505;color:#00ffcc;}
h1{text-align:center;color:#00ff00;margin-bottom:4px;font-size:20px;}
h2{text-align:center;color:#00ffcc;margin-bottom:10px;font-size:14px;}
.container{padding:10px;position:relative;}
button{width:100%;padding:10px;margin:6px 0;background:black;color:#00ff00;border:2px solid #00ff00;cursor:pointer;}
button:hover{background:#00ff00;color:black;}
#output{margin-top:10px;border:1px solid #00ffcc;padding:8px;min-height:120px;white-space:pre-wrap;user-select:text;}

.menu{position:absolute;top:10px;right:10px;font-size:25px;cursor:pointer;}
.menu-items{display:none;position:absolute;top:35px;right:10px;background:black;border:1px solid #00ffcc;padding:5px;width:160px;z-index:10;}
.menu-items button{width:100%;text-align:left;margin:0;padding:8px;}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;z-index:1000;}
.modal-content{background:#000;border:2px solid #00ffcc;padding:10px;max-width:90%;max-height:80%;overflow:auto;text-align:center;}
#cropImage{max-width:100%;max-height:300px;object-fit:contain;}
#profilePic{width:80px;height:80px;border-radius:50%;border:2px solid #00ffcc;margin-bottom:5px;object-fit:cover;}
</style>
</head>
<body>
<script>
  atOptions = {
    'key' : '152d209cd68dd67bc926529695a02e97',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/152d209cd68dd67bc926529695a02e97/invoke.js"></script>
<div class="container">
<h1>Ashik OCR Tool</h1>
<h2>Image to Text Converter</h2>

<!-- Three-dot menu (click will do nothing) -->
<div class="menu" id="menuBtn">⋮</div>
<div class="menu-items" id="menuItems">
  <button id="registerBtn" onclick="openRegister()" style="display:none;">Register</button>
  <button id="profileBtn" onclick="openProfile()" style="display:none;">Profile</button>
</div>

<!-- Image upload (registration ছাড়াই) -->
<input type="file" id="imageInput" accept="image/*">

<div id="output">Waiting...</div>
<button onclick="copyText()">Copy Text</button>

<div id="cropModal" class="modal">
  <div class="modal-content">
    <h3>Crop Your Image</h3>
    <img id="cropImage">
    <button id="cropBtn">Crop</button>
    <button onclick="closeCrop()">Cancel</button>
  </div>
</div>

<div id="convertModal" class="modal">
  <div class="modal-content">
    <h3>Convert Image → Text</h3>
    <button id="convertBtn">Convert</button>
    <button onclick="closeConvert()">Cancel</button>
  </div>
</div>

<script>
let cropper;
let croppedBlob;

// Three-dot menu: click does nothing
const menuBtn=document.getElementById("menuBtn");
menuBtn.addEventListener("click",()=>{
  // Empty function: no popup/modal will open
});

// OCR & Crop logic
const cropModal=document.getElementById("cropModal");
const convertModal=document.getElementById("convertModal");
const cropImg=document.getElementById("cropImage");
const imageInput=document.getElementById("imageInput");
const output=document.getElementById("output");

imageInput.addEventListener("change",function(e){
  const file=e.target.files[0]; if(!file) return;
  cropImg.src=URL.createObjectURL(file);
  cropModal.style.display="flex";
  if(cropper) cropper.destroy();
  cropper=new Cropper(cropImg,{viewMode:1,autoCropArea:0.5,zoomable:false,background:false,responsive:true});
});

document.getElementById("cropBtn").addEventListener("click",function(){
  const cropData=cropper.getData();
  if(cropData.width<10 || cropData.height<10){alert("Define crop box!"); return;}
  cropper.getCroppedCanvas().toBlob(blob=>{
    croppedBlob=blob; cropper.destroy(); cropper=null;
    cropModal.style.display="none"; convertModal.style.display="flex";
  });
});

function closeCrop(){
  if(cropper){cropper.destroy(); cropper=null;}
  cropModal.style.display="none";
  convertModal.style.display="flex";
}

document.getElementById("convertBtn").addEventListener("click",function(){
  convertModal.style.display="none";
  output.innerText="Processing OCR...";
  Tesseract.recognize(croppedBlob,'ben+eng').then(({data:{text}})=>{
    output.innerText=text||"No text found!";
  });
});

function closeConvert(){convertModal.style.display="none";}
function copyText(){navigator.clipboard.writeText(output.innerText);alert("Copied!");}
</script>

</body>
</html>
